name: Weekly Risk Scan

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Use mock data instead of live Graph API"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, pinned 2026-07-28

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build release binary
        run: cargo build --release -p eagraph-cli

      - name: Run scan
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if [ -z "$AZURE_TENANT_ID" ] || [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "No Azure credentials found or dry-run requested, using mock data"
            ./target/release/eagraph scan --dry-run --format html --output risk-report --min-risk medium
          else
            ./target/release/eagraph scan --format html --output risk-report --min-risk medium
          fi

      - name: Upload risk report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: risk-report-${{ github.run_id }}
          path: risk-report.*
          if-no-files-found: ignore
          retention-days: 30
