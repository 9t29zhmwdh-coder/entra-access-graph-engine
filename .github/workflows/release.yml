name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: eagraph
            asset: eagraph-linux
          - os: macos-latest
            bin: eagraph
            asset: eagraph-macos
          - os: windows-latest
            bin: eagraph.exe
            asset: eagraph-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, pinned 2026-07-28

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build release binary
        run: cargo build --release --bin eagraph

      - name: Prepare asset
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.bin }} dist/${{ matrix.asset }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Nur was ueber das workflow-weite contents: read hinausgeht.
      # Read-Rechte hier zu wiederholen ist das, was OpenSSF Scorecard
      # als zu weite Token-Berechtigung bemaengelt.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Flatten artifact layout
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          chmod +x release/eagraph-linux release/eagraph-macos

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Legt das Release an, oder haengt die Dateien an ein bestehendes.
          #
          # Vorher brach der Schritt mit "a release with the same tag name already
          # exists" ab, sobald das Release schon auf anderem Weg entstanden war. Das
          # Ergebnis war ein Release ohne Downloads und ein roter Lauf, obwohl der
          # Build erfolgreich war.
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" release/* --clobber
          else
            gh release create "${{ github.ref_name }}" release/* --repo ${{ github.repository }} --title "entra-access-graph-engine ${{ github.ref_name }}" --notes "See CHANGELOG.md for details. Not code-signed: OS security prompts (Gatekeeper/SmartScreen) may warn on first run; run \`chmod +x\` on macOS/Linux before executing."
          fi
